# forge coverage (cargo-tarpaulin) + complexity (cargo-crap) gates.
#
# One job, one coverage run, two gates fed by it: tarpaulin runs the whole
# workspace suite under instrumentation (it exits non-zero on any test
# failure, so the coverage run IS the test run) and writes lcov.info, which
# cargo-crap then scores. cargo-crap never runs tests itself — it parses
# source with syn and reads the LCOV, scoring CRAP(m) = CC²·(1−cov)³ + CC.
# Without the coverage feed every function scores cov=0 and CRAP collapses
# to CC³+CC, so the complexity gate would measure nothing.
#
# This is a SEPARATE workflow file on purpose: .github/workflows/ci.yml is
# generated by forge_ci (gh-workflow-gen) and any hand edit there is lost
# on the next regeneration. The generated file stays as-is.
#
# Toolchain follows the repo's own convention: the generated ci.yml uses
# actions-rust-lang/setup-rust-toolchain@v1 with toolchain: stable, and the
# rust-toolchain.toml pin (1.92) takes precedence for cargo invocations in
# the checkout. llvm-tools-preview is added here because it backs the
# tarpaulin llvm engine (llvm-profdata/llvm-cov).
#
# Engine choice is MEASURED, not preferred. `--engine Ptrace` is blocked on
# the fleet's sysbox-confined runner containers ("ASLR disable failed:
# EPERM", measured on dirmacs/skywalkers run 38064108686). This repo is
# PUBLIC and runs on ubuntu-latest where ptrace would work, but we still
# use `--engine Llvm` for estate-wide consistency with the fleet runs and
# because it is the more accurate source-based engine. Local measurement
# on the build host ran the same suite under ptrace; engine deltas sit
# inside the floor's ~3pp margin.
#
# Tool pinning: both tools install from per-arch release tarballs at exact
# versions and each version is asserted — two runs cannot disagree because
# one host happened to have a newer cargo-crap. Versions are crates.io
# max_stable_version at authoring: tarpaulin 0.37.5, cargo-crap 0.6.1.
#
# Tests need protoc (tonic/prost in forge_app/forge_infra/forge_repo), same
# as the generated build job (arduino/setup-protoc@v3).

name: coverage-crap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-crap:
    name: coverage + CRAP
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Repo-specific constants, measured on the first run — see the PR that
      # added this job for the numbers and the ratchet.
      #
      # Measured under tarpaulin 0.37.5 on the build host (ptrace, 21-crate
      # workspace, 1855 tests all passing): line coverage 52.01% (9463/18194
      # lines). CI's first real run of this gate (llvm engine, this PR)
      # measured 50.45% (8709/17263 lines), so the floor is set to 47 =
      # measured -3pp margin for suite/engine variance; the ratchet raises
      # it from there.
      COVERAGE_FLOOR: "47"
      # CRAP ceiling after the ui.rs exclusion below: measured max 3660
      # (Renderer::render_event, crates/forge_markdown_stream/src/renderer.rs:125,
      # CC 60, cov 0%) + ~10% headroom.
      CRAP_THRESHOLD: "4030"
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install toolchain (llvm-tools-preview)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Setup Protobuf Compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargo.lock is committed, not generated
        # --locked below exits non-zero if the lockfile is missing or would
        # have to change, so the dependency set can only move when a human
        # commits a reviewed lockfile.
        run: git ls-files --error-unmatch Cargo.lock

      - name: install pinned coverage + CRAP tools
        run: |
          set -euo pipefail
          TARPAULIN_VERSION=0.37.5
          CRAP_VERSION=0.6.1
          case "$(uname -m)" in
            aarch64) arch=aarch64 ;;
            x86_64)  arch=x86_64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          # $GITHUB_PATH only affects LATER steps, not this one -- the
          # version assertions below run here, so the dir must be on PATH
          # inside this same script.
          export PATH="$HOME/.local/bin:$PATH"
          curl -sSLf "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-${arch}-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          curl -sSLf "https://github.com/minikin/cargo-crap/releases/download/v${CRAP_VERSION}/cargo-crap-${arch}-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo-tarpaulin --version | grep -qx "tarpaulin ${TARPAULIN_VERSION}"
          cargo-crap --version | grep -qx "cargo-crap ${CRAP_VERSION}"

      - name: coverage gate (tarpaulin, llvm engine)
        # 21-crate workspace: cap test parallelism (-j 4) so the 4-core
        # ubuntu runner is not oversubscribed; the coverage run is also the
        # test run (tarpaulin exits non-zero on any test failure).
        run: >-
          cargo tarpaulin --engine Llvm --workspace --locked
          --out Lcov --fail-under "$COVERAGE_FLOOR"
          --timeout 300 -j 4

      - name: CRAP gate (fed by this run's coverage)
        # Whole workspace is scored — all Rust lives in crates/* (21 members,
        # no orphan or spike crates). One documented exclude:
        # `--exclude 'src/ui.rs'` is crates/forge_main/src/ui.rs (the only
        # ui.rs in the tree) — a 3533-line TUI dispatch/event-loop surface
        # with 93 scored functions, all at 0% coverage by design (no TTY
        # test harness drives the TUI). Its worst entry (UI::handle_subcommands,
        # CRAP 15006, CC 122) would force a ~16507 ceiling that measures
        # nothing, so it is excluded with the same posture as other repos
        # excluding their entry points; the coverage floor still covers it.
        # cargo-crap --exclude globs are crate-root-relative under
        # --workspace, hence 'src/ui.rs'. Expected stderr warnings: LCOV
        # entries under tests/ match no analyzed source.
        run: >-
          cargo crap --lcov lcov.info --workspace
          --exclude 'src/ui.rs'
          --threshold "$CRAP_THRESHOLD" --fail-above
          --format json > crap.json

      - name: write the run summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Coverage + CRAP gate"
            echo
            if [ -f lcov.info ]; then
              awk -F: '/^LH:/{lh+=$2} /^LF:/{lf+=$2} END {if (lf>0) printf "Line coverage: %.2f%% (%d/%d lines)\n", 100*lh/lf, lh, lf; else print "Line coverage: no LCOV data"}' lcov.info
            else
              echo "Line coverage: no lcov.info (the coverage run did not complete)"
            fi
            if [ -f crap.json ]; then
              # Shell-only parse: the fleet runner containers carry no
              # python3, and a crashing summary must not redden a gate that
              # passed.
              vals=$(tr -d ' \n' < crap.json | grep -o '"crap":[0-9.]*' | cut -d: -f2)
              if [ -n "$vals" ]; then
                n=$(printf '%s\n' "$vals" | grep -c .)
                worst=$(printf '%s\n' "$vals" | sort -g | tail -1)
                echo "Functions scored: $n; worst CRAP: $worst; threshold $CRAP_THRESHOLD"
              else
                echo "WARNING: crap.json present but no entries parsed"
              fi
            else
              echo "CRAP: no crap.json (the CRAP step did not complete)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
